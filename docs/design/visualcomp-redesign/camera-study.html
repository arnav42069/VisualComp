<div id="vc-camera-study" aria-label="VisualComp camera study, geometric preview only">
  <style>
    #vc-camera-study { color:#deded9; font:14px/1.45 'Segoe UI',sans-serif; }
    #vc-camera-study * { box-sizing:border-box; }
    #vc-camera-study .vc-panel { background:#191a18; padding:16px; border-radius:10px; }
    #vc-camera-study .vc-heading { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; margin-bottom:14px; }
    #vc-camera-study .vc-muted { color:#b3b6ae; }
    #vc-camera-study .vc-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 12px; }
    #vc-camera-study .vc-option { min-width:0; text-align:center; }
    #vc-camera-study .vc-choice { width:100%; min-height:36px; font:inherit; color:#dddcd7; background:#282a26; border:1px solid #555950; border-radius:4px; cursor:pointer; }
    #vc-camera-study .vc-choice[aria-pressed="true"] { border-color:#ff7a1f; color:#ffb374; background:#35261a; }
    #vc-camera-study canvas { display:block; max-width:100%; }
    #vc-camera-study .vc-large { width:100%; height:172px; }
    #vc-camera-study .vc-mini { width:100%; height:98px; }
    #vc-camera-study .vc-scale-label { color:#b3b6ae; margin:0 0 5px; }
    #vc-camera-study .vc-elevation { margin-top:5px; color:#b3b6ae; }
    #vc-camera-study .vc-detail { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; gap:20px; margin-top:18px; padding-top:16px; border-top:1px solid #3c3f38; }
    #vc-camera-study .vc-live { width:100%; height:210px; }
    #vc-camera-study input[type="range"] { width:100%; accent-color:#ff7a1f; margin:16px 0; }
    #vc-camera-study output { display:block; color:#ffb374; margin-top:4px; }
    #vc-camera-study .vc-toggles { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:16px; }
    #vc-camera-study .vc-switch { width:115px; padding:7px; border-radius:6px; background:#080908; border:1px solid #42453e; box-shadow:inset 0 3px 6px #000; color:#d2d0c9; font:inherit; cursor:pointer; }
    #vc-camera-study .vc-switch span { display:block; padding:6px 2px; border:1px solid #62655e; border-radius:4px; background:linear-gradient(#30312d,#191a18); box-shadow:0 2px 3px #000,inset 0 1px 1px #73746e55; }
    #vc-camera-study .vc-switch[aria-pressed="true"] { box-shadow:inset 0 0 5px 2px #ca5006,inset 0 -3px 8px #ff7a1f,0 0 5px #ff7a1f25; }
    #vc-camera-study .vc-switch[aria-pressed="true"] span { border-color:#ff9b38; color:#ffc287; box-shadow:0 0 5px #ff810bbb,inset 0 1px 1px #c6bf9944; }
    #vc-camera-study .vc-small-heading { text-align:center; color:#b3b6ae; margin-top:10px; }
    #vc-camera-study .vc-error { color:#ffc287; }
    @media(max-width:560px) {
      #vc-camera-study .vc-options { grid-template-columns:repeat(2,minmax(0,1fr)); }
      #vc-camera-study .vc-detail { grid-template-columns:minmax(0,1fr); gap:4px; }
      #vc-camera-study .vc-large { height:156px; }
      #vc-camera-study .vc-panel { padding:12px; }
    }
  </style>
  <div class="vc-panel">
    <div class="vc-heading"><span>Camera tilt from straight down</span><span class="vc-muted">Fixed 12-groove geometry · angle study</span></div>
    <div class="vc-options"></div>
    <div class="vc-detail">
      <div><canvas class="vc-live" role="img" aria-label="Selected camera angle applied to the knob and gain fader"></canvas></div>
      <div>
        <label for="vc-tilt">Explore camera tilt · 0–30°</label>
        <output id="vc-angle-output" for="vc-tilt" aria-live="polite">10° off top-down · 80° elevation</output>
        <input id="vc-tilt" type="range" min="0" max="30" step="0.5" value="10">
        <div class="vc-muted">Knob + Gain In/Out share the camera</div>
        <div class="vc-toggles" aria-label="Recessed orange toggle illumination preview">
          <button class="vc-switch" type="button" aria-pressed="false" aria-label="Toggle off-state preview"><span>OFF</span></button>
          <button class="vc-switch" type="button" aria-pressed="true" aria-label="Toggle on-state preview"><span>ON</span></button>
        </div>
        <div class="vc-small-heading">Recessed orange light · dark button face</div>
      </div>
    </div>
    <div class="vc-error" role="alert" hidden></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const root=document.getElementById('vc-camera-study');
  const angles=[5,10,15,20,25,30];
  const state={angle:10};
  const options=root.querySelector('.vc-options');
  for(let i=0;i<angles.length;i++) {
    const a=angles[i], cell=document.createElement('div');
    cell.className='vc-option';
    cell.innerHTML=`<button type="button" class="vc-choice" data-angle="${a}" aria-pressed="${a===state.angle}">${String.fromCharCode(65+i)} · ${a}° off top-down</button><div class="vc-elevation">${90-a}° above panel</div><canvas class="vc-large" data-angle="${a}" role="img" aria-label="Enlarged knob, ${a} degrees off top down"></canvas><canvas class="vc-mini" data-angle="${a}" role="img" aria-label="Knob at 78 pixel base diameter, ${a} degrees off top down"></canvas><div class="vc-scale-label">78 px base diameter</div>`;
    options.appendChild(cell);
  }

  // One mesh and one orthographic camera transform. No angle-dependent model edits.
  const VS=`#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNormal;
  uniform float uTheta;
  uniform vec2 uScale;
  uniform vec3 uOffset;
  uniform float uCentreX;
  uniform float uTargetY;
  out vec3 vPos;
  out vec3 vNormal;
  void main(){
    vec3 p=aPos+uOffset;
    float s=sin(uTheta),c=cos(uTheta);
    gl_Position=vec4((p.x-uCentreX)/uScale.x,(p.y*c+p.z*s-uTargetY)/uScale.y,(p.y*s-p.z*c)/8.0,1.0);
    vPos=p; vNormal=aNormal;
  }`;
  const FS=`#version 300 es
  precision highp float;
  in vec3 vPos;
  in vec3 vNormal;
  uniform vec3 uBase;
  uniform vec3 uView;
  uniform float uMetal;
  uniform float uTexture;
  uniform float uEmit;
  out vec4 outColor;
  float hash(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
  void main(){
    vec3 n=normalize(vNormal),l=normalize(vec3(-.65,.60,1.35)),v=normalize(uView);
    vec3 l2=normalize(vec3(1.1,-.2,.8));
    float grain=(hash(floor(vPos*510.0))-.5)*uTexture;
    float lathe=sin(vPos.z*1350.0)*.015*uMetal;
    float diff=.30+.62*max(dot(n,l),0.0)+.16*max(dot(n,l2),0.0);
    float spec=pow(max(dot(n,normalize(l+v)),0.0),mix(35.0,100.0,uMetal));
    float broad=pow(max(dot(n,normalize(l2+v)),0.0),16.0);
    float fres=pow(1.0-max(dot(n,v),0.0),3.0);
    vec3 color=uBase*(diff+grain+lathe)+vec3(spec*(.12+.48*uMetal)+broad*.05+fres*.045)+uBase*uEmit;
    outColor=vec4(color,1.0);
  }`;
  const mats={
    body:{c:[.18,.185,.18],m:.62,t:.055,e:0},
    crown:{c:[.095,.10,.094],m:.20,t:.048,e:0},
    silver:{c:[.79,.81,.80],m:.95,t:.025,e:0},
    edge:{c:[.21,.22,.215],m:.82,t:.025,e:0},
    dark:{c:[.008,.009,.008],m:.12,t:.02,e:0},
    orange:{c:[1,.34,.028],m:.3,t:0,e:.24},
    ticks:{c:[.40,.41,.37],m:.1,t:0,e:0}
  };
  function makeMesh(pos,idx,material) {
    const n=new Float32Array(pos.length);
    for(let i=0;i<idx.length;i+=3){
      const a=idx[i]*3,b=idx[i+1]*3,c=idx[i+2]*3;
      const ab=[pos[b]-pos[a],pos[b+1]-pos[a+1],pos[b+2]-pos[a+2]];
      const ac=[pos[c]-pos[a],pos[c+1]-pos[a+1],pos[c+2]-pos[a+2]];
      const q=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];
      for(const k of [a,b,c]) for(let j=0;j<3;j++) n[k+j]+=q[j];
    }
    for(let i=0;i<n.length;i+=3){const h=Math.hypot(n[i],n[i+1],n[i+2])||1;for(let j=0;j<3;j++) n[i+j]/=h;}
    return {pos:new Float32Array(pos),normal:n,idx:new Uint32Array(idx),material};
  }
  function lathe(profile,material,segments=240) {
    const p=[],id=[],cols=profile.length;
    for(let s=0;s<=segments;s++){const a=s/segments*2*Math.PI;for(const [r,z] of profile)p.push(r*Math.cos(a),r*Math.sin(a),z);}
    for(let s=0;s<segments;s++)for(let j=0;j<cols-1;j++){const a=s*cols+j,b=a+cols;id.push(a,b,b+1,a,b+1,a+1);}
    return makeMesh(p,id,material);
  }
  function skirt() {
    const p=[],id=[],S=384,H=90;
    for(let j=0;j<=H;j++)for(let s=0;s<=S;s++){
      const t=j/H,z=.24+t*1.03,a=s/S*2*Math.PI;
      const nominal=.99-.15*t;
      const u=Math.atan2(Math.sin(a*12),Math.cos(a*12))/12*nominal;
      const end=Math.max(.46-z,0,z-1.04);
      const d=Math.hypot(u,end),radius=.116;
      const q=Math.min(1,d/radius),recess=.105*Math.pow(Math.max(0,1-q*q),.8);
      const r=nominal-recess;
      p.push(r*Math.cos(a),r*Math.sin(a),z);
    }
    for(let j=0;j<H;j++)for(let s=0;s<S;s++){const a=j*(S+1)+s,b=a+S+1;id.push(a,a+1,b+1,a,b+1,b);}
    return makeMesh(p,id,mats.body);
  }
  const crownR=.83,crownEdge=1.275,crownHeight=.072;
  function domeZ(x,y){return crownEdge+crownHeight*Math.pow(Math.max(0,1-(x*x+y*y)/(crownR*crownR)),.72);}
  function crown(){
    const p=[0,0,domeZ(0,0)],id=[],S=240,H=35;
    for(let j=1;j<=H;j++)for(let s=0;s<S;s++){const r=crownR*j/H,a=s/S*2*Math.PI,x=r*Math.cos(a),y=r*Math.sin(a);p.push(x,y,domeZ(x,y));}
    for(let s=0;s<S;s++)id.push(0,s+1,(s+1)%S+1);
    for(let j=1;j<H;j++)for(let s=0;s<S;s++){const a=1+(j-1)*S+s,b=1+j*S+s,c=1+j*S+(s+1)%S,d=1+(j-1)*S+(s+1)%S;id.push(a,b,c,a,c,d);}
    return makeMesh(p,id,mats.crown);
  }
  function roundPoints(w,h,r) {
    const p=[];
    for(const [x,y,a0] of [[w/2-r,h/2-r,0],[-w/2+r,h/2-r,Math.PI/2],[-w/2+r,-h/2+r,Math.PI],[w/2-r,-h/2+r,Math.PI*1.5]])
      for(let i=0;i<12;i++){const a=a0+i/11*Math.PI/2;p.push([x+Math.cos(a)*r,y+Math.sin(a)*r]);}
    return p;
  }
  function patch(cx,cy,w,h,r,zFunc,material){
    const ring=roundPoints(w,h,r),p=[cx,cy,zFunc(cx,cy)],id=[];
    for(const [x,y] of ring)p.push(cx+x,cy+y,zFunc(cx+x,cy+y));
    for(let i=0;i<ring.length;i++)id.push(0,1+i,1+(i+1)%ring.length);
    return makeMesh(p,id,material);
  }
  function prism(w,h,r,z0,z1,material){
    const ring=roundPoints(w,h,r),p=[],id=[],N=ring.length;
    for(const z of [z0,z1])for(const [x,y]of ring)p.push(x,y,z);
    p.push(0,0,z1);
    for(let i=0;i<N;i++){const j=(i+1)%N;id.push(i,j,N+j,i,N+j,N+i,2*N,N+i,N+j);}
    return makeMesh(p,id,material);
  }
  const knob=[
    lathe([[0,.02],[1.025,.02],[1.06,.05],[1.06,.15],[1.055,.20],[1.025,.25],[.97,.26]],mats.silver),
    lathe([[1.06,.095],[1.062,.103],[1.062,.119],[1.06,.126]],mats.edge),
    skirt(),
    lathe([[.833,1.245],[.847,1.262],[.845,1.276],[.83,1.285]],mats.edge),
    crown(),
    patch(0,-.62,.095,.31,.045,(x,y)=>domeZ(x,y)+.002,mats.dark),
    patch(0,-.62,.044,.25,.020,(x,y)=>domeZ(x,y)+.004,mats.orange)
  ];
  const fader=[
    patch(0,0,.26,2.3,.12,()=>.001,mats.edge),
    patch(0,0,.18,2.2,.085,()=>.004,mats.dark),
    prism(.89,.46,.07,.02,.17,mats.silver),
    prism(.80,.35,.075,.17,.27,mats.body),
    patch(0,0,.74,.30,.07,()=>.276,mats.crown),
    patch(0,0,.56,.074,.035,()=>.279,mats.dark),
    patch(0,0,.47,.029,.014,()=>.282,mats.orange)
  ];
  for(let i=-3;i<=3;i++)for(const sign of [-1,1])fader.push(patch(sign*.36,i*.30,.12,.019,.006,()=>.008,mats.ticks));

  try {
    const buffer=document.createElement('canvas');
    const gl=buffer.getContext('webgl2',{alpha:false,antialias:true,preserveDrawingBuffer:true});
    if(!gl)throw new Error('WebGL2 is needed to display the measured camera views.');
    function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
    const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const loc={};for(const n of ['uTheta','uScale','uOffset','uCentreX','uTargetY','uBase','uView','uMetal','uTexture','uEmit'])loc[n]=gl.getUniformLocation(program,n);
    function upload(m){
      const vao=gl.createVertexArray();gl.bindVertexArray(vao);
      for(const [i,data]of [[0,m.pos],[1,m.normal]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,0,0);}
      const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,m.idx,gl.STATIC_DRAW);
      return {vao,count:m.idx.length,material:m.material};
    }
    const K=knob.map(upload),F=fader.map(upload);
    function drawGroup(group,x){
      gl.uniform3f(loc.uOffset,x,0,0);
      for(const d of group){const m=d.material;gl.uniform3fv(loc.uBase,m.c);gl.uniform1f(loc.uMetal,m.m);gl.uniform1f(loc.uTexture,m.t);gl.uniform1f(loc.uEmit,m.e);gl.bindVertexArray(d.vao);gl.drawElements(gl.TRIANGLES,d.count,gl.UNSIGNED_INT,0);}
    }
    function render(target,angle,kind){
      const w=target.clientWidth,h=target.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
      if(w<1||h<1)return;
      buffer.width=target.width=Math.round(w*dpr);buffer.height=target.height=Math.round(h*dpr);
      const paired=kind==='paired',basePixels=kind==='mini'?78:paired?Math.min(w*.48,140):Math.min(w*.76,150);
      const halfX=w/basePixels*1.06,halfY=h/basePixels*1.06;
      const theta=angle*Math.PI/180,s=Math.sin(theta),c=Math.cos(theta);
      gl.viewport(0,0,buffer.width,buffer.height);gl.clearColor(.098,.102,.094,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.useProgram(program);
      gl.uniform1f(loc.uTheta,theta);gl.uniform2f(loc.uScale,halfX,halfY);gl.uniform1f(loc.uTargetY,.64*s);gl.uniform1f(loc.uCentreX,paired?.7:0);gl.uniform3f(loc.uView,0,-s,c);
      drawGroup(K,0);if(paired)drawGroup(F,1.86);
      const ctx=target.getContext('2d');ctx.drawImage(buffer,0,0);
      target.dataset.renderedAngle=String(angle);target.dataset.baseDiameter=String(basePixels);
    }
    function update(){
      const angle=Number(state.angle);
      root.querySelector('#vc-tilt').value=String(angle);
      root.querySelector('#vc-angle-output').textContent=`${angle}° off top-down · ${90-angle}° elevation`;
      for(const b of root.querySelectorAll('.vc-choice'))b.setAttribute('aria-pressed',String(Number(b.dataset.angle)===angle));
      render(root.querySelector('.vc-live'),angle,'paired');
    }
    function renderAll(){for(const c of root.querySelectorAll('.vc-large,.vc-mini'))render(c,Number(c.dataset.angle),c.classList.contains('vc-mini')?'mini':'large');update();}
    options.addEventListener('click',event=>{const b=event.target.closest('.vc-choice');if(b){state.angle=Number(b.dataset.angle);update();}});
    root.querySelector('#vc-tilt').addEventListener('input',event=>{state.angle=Number(event.target.value);update();});
    for(const b of root.querySelectorAll('.vc-switch'))b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.querySelector('span').textContent=on?'ON':'OFF';});
    new ResizeObserver(renderAll).observe(root);
    renderAll();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:update});tweak.addSlider(state,'angle',{label:'Camera tilt from top-down',min:0,max:30,step:.5,unit:'°'});}
    // Read-only proof values for inspection: shared data, exact rotation, fixed scale.
    window.__vcCameraStudy={angles,meshCount:knob.length,grooves:12,project:(x,y,z,deg)=>[x,y*Math.cos(deg*Math.PI/180)+z*Math.sin(deg*Math.PI/180)],selectAngle(deg){state.angle=deg;update();},get angle(){return state.angle;}};
    root.dataset.ready='true';
  } catch(error) {const out=root.querySelector('.vc-error');out.hidden=false;out.textContent=error.message;root.dataset.ready='error';}
})();
</script>
